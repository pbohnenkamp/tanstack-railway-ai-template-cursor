name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - stage
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      prior_environment: ${{ steps.target.outputs.prior_environment }}
    steps:
      - name: Resolve target environment
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          case "${ENV}" in
            stage) echo "prior_environment=dev" >> "$GITHUB_OUTPUT" ;;
            production) echo "prior_environment=stage" >> "$GITHUB_OUTPUT" ;;
            *) echo "prior_environment=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Guard stage/production to main only
        if: steps.target.outputs.environment == 'stage' || steps.target.outputs.environment == 'production'
        run: |
          REF="${{ github.ref }}"
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "::error::stage and production deploys are only allowed from main (got ${REF})"
            exit 1
          fi

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting for CI workflow run for ${SHA}..."
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "ci.yml" \
              --commit "${SHA}" \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0].databaseId // empty')
            if [[ -n "${RUN_ID}" ]]; then
              break
            fi
            echo "No CI run listed yet (attempt ${attempt}/30); sleeping 20s..."
            sleep 20
          done
          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::No CI workflow run found for commit ${SHA}."
            exit 1
          fi
          echo "Watching CI run ${RUN_ID}..."
          if gh run watch "${RUN_ID}" --repo "${{ github.repository }}" --exit-status; then
            echo "CI run ${RUN_ID} succeeded."
            exit 0
          fi
          echo "::error::CI workflow run ${RUN_ID} did not succeed for ${SHA}."
          gh run view "${RUN_ID}" --repo "${{ github.repository }}" || true
          exit 1

      - name: Require prior environment deployment
        if: steps.target.outputs.prior_environment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR: ${{ steps.target.outputs.prior_environment }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking for successful GitHub Deployment of ${SHA} to ${PRIOR}..."
          DEPLOYMENT_IDS=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=${PRIOR}&sha=${SHA}&per_page=20" \
            --jq '.[].id')
          if [[ -z "${DEPLOYMENT_IDS}" ]]; then
            echo "::error::No GitHub Deployment found for ${SHA} in environment '${PRIOR}'. Deploy to ${PRIOR} first."
            exit 1
          fi
          for id in ${DEPLOYMENT_IDS}; do
            STATE=$(gh api \
              "repos/${{ github.repository }}/deployments/${id}/statuses" \
              --jq '.[0].state // empty')
            echo "Deployment ${id} latest state: ${STATE}"
            if [[ "${STATE}" == "success" ]]; then
              echo "Prior environment '${PRIOR}' has a successful deployment for this SHA."
              exit 0
            fi
          done
          echo "::error::No successful deployment status for ${SHA} in '${PRIOR}'."
          exit 1

  deploy:
    name: Deploy to ${{ needs.prepare.outputs.environment }}
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ steps.meta.outputs.app_url }}
    outputs:
      app_url: ${{ steps.meta.outputs.app_url }}
      deployment_id: ${{ steps.gh_deploy.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve APP_URL
        id: meta
        run: |
          URL="${{ vars.APP_URL }}"
          if [[ -z "${URL}" ]]; then
            echo "::error::GitHub Environment variable APP_URL is not set for '${{ needs.prepare.outputs.environment }}'"
            exit 1
          fi
          echo "app_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Deployment
        id: gh_deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID=$(jq -n \
            --arg ref "${{ github.sha }}" \
            --arg environment "${{ needs.prepare.outputs.environment }}" \
            '{
              ref: $ref,
              environment: $environment,
              description: "Railway deploy via GitHub Actions",
              auto_merge: false,
              required_contexts: []
            }' \
            | gh api \
              --method POST \
              "repos/${{ github.repository }}/deployments" \
              --input - \
              --jq '.id')
          if [[ -z "${DEPLOYMENT_ID}" || "${DEPLOYMENT_ID}" == "null" ]]; then
            echo "::error::Failed to create GitHub Deployment"
            exit 1
          fi
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            "repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f environment="${{ needs.prepare.outputs.environment }}" \
            -f description="Deploying to Railway" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy with Railway
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "::error::RAILWAY_TOKEN secret is not set for environment '${{ needs.prepare.outputs.environment }}'"
            exit 1
          fi
          PROJECT="${{ vars.RAILWAY_PROJECT_ID }}"
          SERVICE="${{ vars.RAILWAY_SERVICE_ID }}"
          ENVIRONMENT="${{ vars.RAILWAY_ENVIRONMENT_ID }}"
          if [[ -z "${PROJECT}" || -z "${SERVICE}" || -z "${ENVIRONMENT}" ]]; then
            echo "::error::Set RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID, and RAILWAY_ENVIRONMENT_ID on the GitHub Environment"
            exit 1
          fi
          railway up \
            --ci \
            --project "${PROJECT}" \
            --service "${SERVICE}" \
            --environment "${ENVIRONMENT}" \
            --message "gha ${{ github.sha }}"

      - name: Mark GitHub Deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/deployments/${{ steps.gh_deploy.outputs.deployment_id }}/statuses" \
            -f state="success" \
            -f environment="${{ needs.prepare.outputs.environment }}" \
            -f description="Railway deploy succeeded" \
            -f environment_url="${{ steps.meta.outputs.app_url }}" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark GitHub Deployment failure
        if: failure() && steps.gh_deploy.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/deployments/${{ steps.gh_deploy.outputs.deployment_id }}/statuses" \
            -f state="failure" \
            -f environment="${{ needs.prepare.outputs.environment }}" \
            -f description="Railway deploy failed" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  smoke:
    name: Smoke (${{ needs.prepare.outputs.environment }})
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install chromium --with-deps
      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.app_url }}
        run: pnpm test:smoke
