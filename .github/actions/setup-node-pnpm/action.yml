name: Setup Node and pnpm
description: Checkout is done by the caller. Installs pnpm, Node 22, and frozen lockfile deps.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
